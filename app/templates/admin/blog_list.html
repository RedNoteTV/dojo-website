<div id="posts-list">
  {% if msg %}<p class="ok" role="status">{{ msg }}</p>{% endif %}
  {% for p in posts %}
  <div class="card item">
    <div class="grow"><strong>{{ p.title }}</strong><br><small>{{ p.created.strftime('%d-%m-%Y') }} · taal: {{ p.lang|upper }}</small></div>
    <div class="row">
      <button class="btn mini" hx-get="/admin/blog/{{ p.id }}/edit" hx-target="#form-area" hx-swap="innerHTML show:top">Bewerken</button>
      <button class="btn mini danger" hx-delete="/admin/blog/{{ p.id }}" hx-confirm="Zeker weten? Dit bericht verdwijnt van de website." hx-target="#posts-list" hx-swap="outerHTML">Verwijderen</button>
    </div>
  </div>
  {% else %}<p>Nog geen berichten. Klik op "+ Nieuw bericht".</p>{% endfor %}
</div>
{% if oob %}<div id="form-area" hx-swap-oob="true"></div>{% endif %}
